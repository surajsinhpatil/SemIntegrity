# Statistical analysis plan (proposal §4.11). Frozen at preregistration (Phase 4).
independent_unit: constraint
pair_level_independence_assumption: FORBIDDEN
rationale: "pairs (A,B) and (A,C) share response A; with K=8 effective information is closer to 8 responses than 28 pairs"

confirmatory:
  procedure: cluster_bootstrap
  resample: constraints_with_replacement
  n_boot: 10000
  ci: 0.95
  ci_method: BCa
  seed: 20250058
  contrasts:
    - id: H1_primary
      name: "C1+C2 vs C3+C4"
      arm_size: 60
      direction: "higher-structure classes expected greater; two-sided test reported"
    - id: H1_planned
      name: "C4 vs C1-C3 pooled"
  multiplicity: "confirmatory contrasts are pre-specified and EXEMPT from FDR"

descriptive:
  four_class_profile: "individual class estimates with cluster-bootstrap intervals"
  framing: "structural inconsistency PROFILE, not a complexity curve"

secondary_model:
  family: beta_binomial_mixed
  response: "cbind(contradictions, evaluable_pairs - contradictions)"
  formula: >-
    contradictions / evaluable_pairs ~ class * model_family
    + log(entity_sitelinks)
    + answer_space_cardinality
    + probe_polarity + probe_syntax + probe_direction
    + (1 | schema/constraint)
    + (1 | domain)
  overdispersion_absorbs: residual_pair_dependence
  # DECIDED 2026-10-06 (researcher) — ADR-0017, decisions A3 + A4.
  answer_space_cardinality:
    status: DECIDED
    term: answer_space_cardinality
    definition: "len(constraint.answer_space); 2 for boolean, 3 for entity/date as authored"
    why: >-
      Chance agreement between two independent draws from a closed space of size
      m is 1/m, so the chance contradiction rate is 1 - 1/m: 0.667 at m=3 and
      0.500 at m=2. ADR-0017 makes answer type a function of the schema axis, so
      every class receives the same mix (10 entity / 10 boolean / 10 date) and
      the same chance-PSCR of 0.611 — the balance, not the covariate, is what
      protects the confirmatory contrast, because §4.11 states that "a bootstrap
      on a difference in means cannot deliver covariate adjustment". The
      covariate is retained in addition, for the model-based analyses, because
      D1 and D4 also read answer_space and a residual cardinality effect would
      otherwise load onto the class coefficient.
    not_in_confirmatory_model: true
    confirmatory_protection: "design balance (ADR-0017), not adjustment"
  # DECIDED 2026-09-11 (researcher) — option A, see ADR-0009.
  probe_factor_unit_conflict:
    status: DECIDED
    resolution: disaggregate_binomial_cells
    unit_of_analysis: "constraint x model x pair-factor-cell"
    pair_factor_cells:
      # A pair has TWO probes. Each probe factor becomes an UNORDERED pair-level
      # level, so the covariate is well-defined at the row's unit.
      polarity:  [aff-aff, aff-neg, neg-neg]
      syntax:    [dec-dec, dec-int, dec-clz, int-int, int-clz, clz-clz]
      direction: [dir-dir, dir-rev, rev-rev]
    denominator: "evaluable pairs falling in that cell"
    note: >-
      Cells are sparse by construction (28 pairs spread over up to 3x6x3 = 54
      combinations), so the three factors enter as separate main effects, not as
      a full interaction. Cells with zero evaluable pairs contribute no row.
  backend:
    # RESOLVED 2026-09-25 by the cluster probe: R is NOT installed on the BITS
    # CSIS cluster (`which R Rscript` -> not found), and none of the Lmod
    # modules provides it. glmmTMB is therefore unavailable, so the PyMC path
    # is not a preference but the only option. Recorded so the paper states
    # this as a constraint rather than a choice.
    status: RESOLVED
    primary: pymc                     # beta-binomial + random intercepts
    crosscheck: none_available
    crosscheck_reason: "no R and no R module on the cluster; glmmTMB cannot be run"
    consequence: >-
      Intervals from this model are Bayesian CREDIBLE intervals, not confidence
      intervals, and the priors become preregistered quantities. §4.11's
      precedence rule is unaffected: the cluster bootstrap still carries the
      confirmatory claim.
  domain_random_effect_caveat: "5 levels is at the lower bound for a random effect; report variance estimate with caution"

exploratory:
  - qwen_scale_trend_3b_7b_14b        # descriptive; NOT a scaling law
  - knowledge_conditioned_analysis
  - pcs_vs_pscr_divergence_on_closed_answer_subset
  - stochastic_vs_fixed_decoding_variance_decomposition

multiplicity:
  method: benjamini_hochberg
  applied_to: "everything outside the pre-specified confirmatory contrasts"

precedence: "Where the bootstrap and the GLMM disagree on a quantity both can estimate, the BOOTSTRAP governs and the discrepancy is reported."

knowledge_availability:
  screen: "prerequisite atomic facts asked directly of each model"
  reporting: [unconditional, conditioned_on_demonstrable_knowledge]
  conditioning_is_an_inclusion_criterion: false     # reporting view ONLY
