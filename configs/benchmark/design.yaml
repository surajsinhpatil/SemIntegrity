# ===========================================================================
# Benchmark design lattice (proposal §4.3)
# The design is fully determined by the proposal's counts; this file states
# the resolution explicitly so it can be machine-validated before authoring.
# See docs/decisions/ADR-0002-benchmark-design-lattice.md
# ===========================================================================
lattice:
  # 30 families x 4 classes = 120 constraints
  # 6 families per domain x 5 domains = 30 families
  #  -> 6 constraints per domain per class                     (§4.3 ✓)
  #  -> 30 constraints per class                               (§4.3 ✓)
  family:
    count: 30
    spans_all_classes: true
    domain_fixed_within_family: true
    purpose: >-
      Nuisance control (§4.3): same domain, comparable entity familiarity,
      answer type and lexical complexity across the 4 class variants.
      Family variants are deliberately NOT semantically equivalent.
  schema:
    count_per_class: 6
    instances_per_schema: 5
    crossing: "schema x domain fully crossed (6 x 5 = 30 per class)"
    statistical_role: "nested random effect (1 | schema/constraint)"
  domain:
    count: 5
    constraints_per_domain_per_class: 6
    statistical_role: "(1 | domain) — balancing/control variable ONLY; no inferential claim"
    order: [geography, history, biology, public_office, science_technology]  # §4.3's own order

  # DECIDED 2026-10-06, AMENDED 2026-10-07 (researcher) — ADR-0017 + Option B.
  #
  # §4.3 asks families to hold "comparable answer type" approximately constant
  # ACROSS classes, so answer type is NOT a function of the class alone. The
  # original rule made it a function of the schema AXIS alone; that collided with
  # the approved probe generator, which routes a direct+affirmative probe of an
  # entity/date-answered constraint through `_realise_open` and so requires a
  # single binary subject-relation-object. A conjunction (C2) and a universal (C3)
  # have no such structure. ADR-0017 is therefore amended: answer type is a
  # function of (axis, class).
  answer_type:
    status: DECIDED
    fixed_by: axis_and_class          # amended 2026-10-07; was schema_axis
    rule:
      C1: per_axis                    # retains the approved axis-fixed allocation
      C2: boolean                     # all axes — no single binary relation exists
      C3: boolean                     # all axes — no single binary relation exists
      C4: per_axis                    # retains the approved axis-fixed allocation
    per_axis:
      1: entity      # unique designated role-bearer
      2: boolean     # disjoint category membership
      3: entity      # part-whole containment
      4: date        # event precedence
      5: boolean     # extremal uniqueness
      6: date        # interval boundary
    date_axes: [4, 6]                 # read by the corroboration rule; see below
    # Descriptive distribution, not an experimental factor. The confirmatory
    # contrast C1+C2 vs C3+C4 stays exactly balanced (0.556 vs 0.556); the
    # four-class descriptive profile carries a 0.111 spread. Answer type enters
    # the secondary model as a covariate, never as a factor.
    chance_pscr_per_class: {C1: 0.611, C2: 0.500, C3: 0.500, C4: 0.611}
    confirmatory_balance: "C1+C2 = C3+C4 = 0.556; gap 0.000"
    descriptive_spread: 0.111
    covariate: answer_space_cardinality  # configs/analysis/statistics.yaml
    accepted_cost: >-
      The four-class descriptive profile is no longer artefact-free: it carries a
      0.111 chance-PSCR spread, against 0.000 under the original axis-only rule
      and 0.167 under a fully class-tied one. The confirmatory contrast, which
      §4.11 says carries the claim, remains exactly balanced. D0's temporal-anchor
      predicate reaches only C1/C4 on the two date axes.

  # DECIDED 2026-10-06 (engineering) — ADR-0003 consequences.
  # ADR-0003 rotates syntax by each constraint's 0-based position WITHIN ITS CLASS
  # and requires that position to be stable once frozen. It is derived from the
  # records by semintegrity.benchmark.ordering, never from source-file order.
  constraint_ordering:
    status: DECIDED
    implementation: semintegrity.benchmark.ordering.constraint_indices
    keys: [domain (in the order above), schema index, constraint cell index]
    why: >-
      Source-file order used to determine constraint_index, so re-ordering two
      families in candidates.yaml would silently re-word a third of all probes.
    verified_by: tests/unit/test_constraint_ordering.py

validation_rules:              # enforced by src/semintegrity/benchmark/design_validator.py
  - id: total_count
    assert: "len(constraints) == 120"
  - id: class_balance
    assert: "every class has exactly 30 constraints"
  - id: domain_class_balance
    assert: "every (domain, class) cell has exactly 6 constraints"
  - id: family_completeness
    assert: "every family has exactly one constraint per class"
  - id: family_domain_fixed
    assert: "all constraints in a family share one domain"
  - id: schema_balance
    assert: "every schema has exactly 5 instances; no schema dominates a class"
  - id: sitelink_matching
    assert: "entity_sitelinks distribution matched across classes (see thresholds below)"
  - id: unique_ids
    assert: "constraint_id, family_id, schema_id, probe_id are globally unique"

entity_familiarity:
  metric: wikidata_sitelinks     # deterministic, not time-sensitive (§4.3)
  aggregate_per_constraint: median_over_entities
  matching_test:
    # Pre-registered check that class is not confounded with entity familiarity.
    procedure: kruskal_wallis_over_classes
    target: "p > 0.10 (fail to reject equality of distributions)"
    on_failure: "re-author offending constraints BEFORE freeze; never after"
  covariate_in_model: "log(entity_sitelinks)"

ground_truth:
  primary_source: wikidata
  wikidata_is_absolute_truth: false
  # PREFERRED anchor, NOT a precondition on class C4 — see ADR-0020
  # (APPROVED 2026-10-08). No code reads this field. Where a fact's temporal
  # structure is carried by a direct date property (P571 inception, P576
  # dissolved) instead of a statement's validity qualifiers, that property is
  # the correct anchor and is read by claim_time / claim_literal. The FROZEN
  # pilot's C4 cells and 5 authored test C4 cells already do exactly that.
  temporal_qualifiers_required: [P580, P582]   # start time, end time
  corroboration_required_for: [history, temporal_facts]
  second_source_required: true
  per_constraint_fields: [gold_source, gold_source_url, gold_source_date]

splits:
  # DECIDED 2026-09-11 (researcher) — see ADR-0007.
  # The 120 constraints ARE the test set, so the confirmatory arms stay at
  # exactly 60/60. Development data is a SEPARATE, DISJOINT set.
  status: DECIDED
  development:
    source: "separate set, disjoint from the 120"
    size: 24
    per_class: 6
    composition:
      - "the 12 Phase-1 pilot constraints (3 per class) are absorbed into it"
      - "12 further constraints authored to reach 6 per class"
    entity_rule: "same schemas as the test set, DIFFERENT entity instantiations"
    disjointness_rule: >-
      No entity set, gold proposition or probe surface form may be shared with
      a test constraint. Enforced by benchmark/design_validator.py before freeze.
    uses:
      - d2_checkpoint_selection
      - d2_per_class_threshold_calibration
      - d3_prompt_tuning
      - trackb_extraction_rule_tuning
      - d0_predicate_correction
      - canonicaliser_alias_tuning
    probes_per_constraint: 8
    probe_count: 192
  test:
    source: "the frozen 120"
    size: 120
    per_class: 30
    uses: [all_confirmatory_and_descriptive_analysis]
    rule: "nothing is tuned on this set; every tuned artefact is hashed and frozen before it is touched"

  # CONFIRMED 2026-10-06 (researcher) — decision A7. See docs/BENCHMARK_ACCOUNTING.md.
  # The 120 is unchanged from §4.3 and Appendix A.1 ("120 total"). What ADR-0007
  # settles is the AUTHORING bill: none of the existing 12 can be one of the 120.
  accounting:
    status: CONFIRMED
    existing_pilot_constraints: 12          # -> dev; already tuning data, so §5.6 bars them from test
    new_test_constraints: 120
    new_dev_constraints: 12                 # to reach ADR-0007's 24
    constraints_at_freeze: 144              # 120 test + 24 dev
    newly_authored_constraints: 132
    existing_pilot_probes: 96               # stay pilot/dev material; 28 rewritten under RW-001
    new_primary_probes: 1056                # 960 test + 96 new dev
    primary_probes_at_freeze: 1152          # 960 + 192
    test_cell_index_range: [11, 16]         # 01..10 reserved for pilot/dev; the id grammar has no split field
    cross_split_check: semintegrity.benchmark.design_validator.BenchmarkDesignValidator.validate_global_id_uniqueness
