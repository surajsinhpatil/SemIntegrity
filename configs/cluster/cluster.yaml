gpus:
  status: PROBED
  gres_string: "gpu:a100-80gb:2"
  model: "NVIDIA A100 80GB (PCIe)"
  vram_gb: 80
  per_node: 2
  node_cpus: 128
  node_mem_mb: 240000
  features: [a100-80gb, pcie]
  implication: >-
    80 GB per GPU is ample: every model up to 14B fits on ONE A100 in bf16 with
    room for KV cache. Llama-3.3-70B at ~141 GB needs 2 GPUs (tensor_parallel_size=2),
    which is EXACTLY the account's gres/gpu=2 limit (re-observed 2026-10-14, see
    account_limits) — so the 70B consumes the whole account's GPU allowance and
    can share the cluster with no other GPU job of ours.
  bf16_supported: true          # A100 — confirmed by hardware class; re-asserted in the env test
  driver_version: "570.158.01"  # observed on csis.cn4
  cuda_runtime_supported: "12.8"
  observed_free_vram_mib: 81906  # of 81920; only Xorg resident
  device_isolation_caveat: >-
    `scontrol show config` reports ConstrainDevices = no, so cgroups do NOT
    fence GPUs between jobs. nvidia-smi showed BOTH GPUs even though only one
    was requested. Slurm still sets CUDA_VISIBLE_DEVICES, and vLLM honours it,
    but a process that ignores that variable could touch a GPU belonging to
    another job. Every job must therefore log CUDA_VISIBLE_DEVICES and must
    never enumerate devices directly.

storage:
  status: PROBED
  filesystem: "/dev/sdb1 mounted at /nfs_home (24 TB, 31% used)"
  quota_used_gb: 955          # RE-MEASURED 2026-10-14. Was 713 on 2026-09-25 and
                              # 687 before that: consumption is RISING ~120 GB/mo.
  quota_soft_gb: 999
  quota_hard_gb: 1000
  headroom_gb: 45             # 955 of 1000 GB hard limit. NOT 286 any more.
  model_cache_gb: 17          # hf_cache holds only 17 GB of the 955 (14B 1.9 +
                              # 3B 0.012 + 7B 15), so ~938 GB is something else
                              # and has never been accounted for. Find it before
                              # planning any further staging.
  df_is_misleading: >-
    `df -h /nfs_home` reports 15 T available and is IRRELEVANT: the per-USER
    quota binds at 1000 GB and is the thing that stops a download. A df-based
    free-space check passes while the download fails. scripts/models/
    cache_weights.sh now reads `quota` and takes the SMALLER of the two.
  quota_is_shared: true
  quota_warning: >-
    RE-MEASURED 2026-10-14: 955 GB used, ~45 GB of headroom. All seven models in
    bf16 are ~244 GB, so they NO LONGER FIT EVEN ON PAPER. One-at-a-time staging
    with eviction is now mandatory rather than merely advisable, and
    llama33-70b alone needs 141 GB — more than the 45 GB free plus the 17 GB of
    evictable cache combined, so ~100 GB must be freed elsewhere before the 70B
    can be staged at all. This is the live form of the readiness audit's
    standing storage FAIL.
    The older note read: The 713 GB already used belongs to the WHOLE shared
    account: ~286 GB of headroom against a 1 TB hard limit, re-measured
    2026-09-25. All seven models in bf16 are ~244 GB, so they fit only on paper
    — that would leave ~42 GB for
    everyone else on the account and risk hitting the hard limit mid-run. STAGE
    models one at a time and EVICT; never cache all seven at once. Note `df`
    reports 16 TB free on /nfs_home, which is the filesystem, not the limit that
    binds: the quota is what stops a job.
  # Weights needed if all 7 models are cached in bf16 (estimates):
  #   3B ~7 + 7B ~16 + 7B ~15 + 8B ~16 + 9B ~19 + 14B ~30 + 70B ~141  =  ~244 GB
  estimated_weights_gb: 244
  hf_home: "${WORK_DIR}/hf_cache"
  note: "weights are cached ONCE from a non-GPU session, never inside GPU time (§4.13)"

software:
  # VERIFIED on the login node, 2026-09-25. glibc is the constraint that decided
  # the inference stack: it rules out every CUDA-12 vLLM from 0.12.0 onward,
  # because those ship manylinux_2_31 wheels. See ADR-0015.
  os: "Rocky Linux 8.10 (Green Obsidian)"
  os_family: "rhel8"
  kernel: "4.18.0-553.el8_10.x86_64"
  glibc: "2.28"
  glibc_consequence: >-
    manylinux_2_31 wheels (vllm 0.12.0-0.19.1, the CUDA-12 line) will NOT
    install. The only CUDA-12 vLLM wheels this host accepts are the manylinux1
    line, 0.11.2 and below. ADR-0013's 0.19.1 pin was unexecutable here.

  # Observed in the login banner, 2026-09-25. Full list still needs `module avail`.
  module_system: lmod                  # Lmod 8.7.65
  available_modules:
    apps:      [cuda/12.8, gamess/00, jupyter/lab, miniconda/default, nvhpc/24.1, singularity/4.4.0]
    envs:      [pytorch/1.0, "pytorch/2.10 (default)", tensorflow/1.0]
    lang:      [python/3.6, "python/3.13.7 (default)"]
    libraries: [boost/1.84.0, fftw/3.3.10-double, hdf5/1.14.3-serial, lapack/3.12.0, openblas/0.3.27, scalapack/2.2.1]
  system_python: "3.6.8 — FAR too old; a module must always be loaded"
  conda: "/usr/local/bin/conda (system-wide)"
  cuda_module: cuda/12.8
  torch_module: pytorch/2.10
  nvcc_on_login_node: false            # expected; cuda module not loaded by default

  # Resolved by `setup_env.sh --gpu` on 2026-09-25. Exact pins are in
  # requirements/lock/cluster-gpu.txt (247 packages).
  cuda_build_constraint:
    driver: "570.158.01"
    driver_cuda: "12.8"
    required_wheel_variant: cu128
    rule: >-
      CUDA 13 wheels need a 580+ driver. This cluster is on 570, so every torch
      build MUST be cu12x. Installed with:
        pip install --index-url https://download.pytorch.org/whl/cu128 \
          torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
    first_attempt_failed:
      installed: "torch 2.13.0+cu130 via vllm 0.30.0"
      error: "The NVIDIA driver on your system is too old (found version 12080)"
      cause: >-
        `pip install vllm` takes the newest release; vLLM >= 0.27 pins
        torch==2.13.0, whose default PyPI wheel is cu130. The mismatch is
        invisible on the login node and only appears on a GPU node.

  # Observed state BEFORE repair, 2026-09-25. This environment is broken: it
  # carries BOTH CUDA lineages side by side (nvidia-cublas 13.1.1.3 alongside
  # nvidia-cublas-cu12 12.8.4.1, nccl-cu12 alongside nccl-cu13, ...), wreckage
  # from the 0.30.0 and 0.26.0 attempts.
  observed_stack_before_repair:
    python: "3.11.16"
    torch: "2.11.0+cu128"          # CUDA 12 — fine
    torchvision: "0.26.0+cu128"
    torchaudio: "2.11.0+cu128"
    transformers: "5.17.0"
    vllm: "0.26.0 — UNUSABLE"
    vllm_evidence: >-
      Static scan of the installed package on this host, 2026-09-25:
      16 shared objects scanned, libcudart references {'13': 198}, zero to
      libcudart.so.12. Confirmed on the artefact, not inferred from metadata.
    cuda13_root_cause: >-
      vllm 0.26.0 pulled nvidia-cutlass-dsl (shared with flashinfer-python,
      quack-kernels and tokenspeed-mla, all its own dependencies), which dragged
      in the cu13 chain. nvidia-cudnn-cu13 and nvidia-nccl-cu13 are left as
      orphans with no remaining dependents.

  # The stack ADR-0015 pins. Installed by scripts/cluster/fix_torch_cuda.sh.
  target_stack:
    python: "3.11.16"
    torch: "2.9.0+cu128"           # pinned by vllm 0.11.2; cp311 manylinux_2_28 wheel exists
    torchvision: "0.24.0+cu128"
    torchaudio: "2.9.0+cu128"
    vllm: "0.11.2"                 # last manylinux1 release; links libcudart.so.12
    transformers: ">=4.56,<5"      # required by vllm 0.11.2
    inference_stack: vllm          # ADR-0015; ADR-0012 (transformers) was REJECTED
    note: >-
      vLLM is version-pinned deliberately. Letting pip take the newest release
      silently changes the CUDA build, which §4.13 forbids: a single inference
      stack, held constant across all models.

  cache_containment:
    status: VERIFIED, then CORRECTED
    date: 2026-09-26
    correction: >-
      The 2026-09-25 version of this pinned VLLM_CACHE_ROOT,
      TORCHINDUCTOR_CACHE_DIR and TRITON_CACHE_DIR under work_dir, i.e. on NFS.
      That satisfied the shared-account rule and broke every subsequent GPU job.
      Triton and Inductor cache COMPILED SHARED OBJECTS which are dlopen'd during
      CUDA init; NFS gives no reliable locking and different mmap semantics.
      Five jobs failed (12081, 12089, 12090, 12092, 12093) with SIGSEGV inside
      EngineCore before parallel_state, on four different nodes, with no
      Python-level traceback. The runs that CREATED the cache succeeded; every
      run that READ it died. Moving the caches aside fixed it immediately
      (job 12094, COMPLETED, 8/8 generations).
      Now: HF_HOME and XDG_CACHE_HOME stay in work_dir; the three JIT caches go
      to ${SLURM_TMPDIR:-/tmp}/semint-jit-${SLURM_JOB_ID} and are deleted on job
      exit. Cost is one torch.compile per job, ~16 s. A compile cache is a
      derived build artefact, not a reproducibility artefact.
    original_date: 2026-09-25
    rule: "shared account -- nothing may be written outside work_dir"
    pinned_in: slurm/templates/_common.sh
    variables: [HF_HOME, XDG_CACHE_HOME, VLLM_CACHE_ROOT, TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR]
    note: >-
      vLLM 0.11.2 OVERWRITES TORCHINDUCTOR_CACHE_DIR and TRITON_CACHE_DIR at
      runtime (compiler_interface.py:308,311), redirecting them inside its own
      base_cache_dir. Since that is derived from VLLM_CACHE_ROOT, pinning
      VLLM_CACHE_ROOT is sufficient for everything vLLM compiles; the other two
      matter only for torch.compile used outside vLLM.
    evidence: >-
      Job 11968 (pre-fix) wrote 40 files to ~/.cache/vllm between 23:06:00 and
      23:07:04 IST. Job 11969 (post-fix) ran 23:18:05-23:19:12 and wrote ZERO
      files under $HOME: `find ~/.cache -newermt '23:18:00' ! -newermt
      '23:20:00'` returned empty, while vLLM logged the project-local path and
      torch.compile rebuilt there (15.89 s). The 40 stale pre-fix files are
      inert and were deliberately left in place -- deleting anything in a shared
      account's home is the researcher's decision.

  blas_thread_hazard:
    observed: "2026-09-25 — pytest stalled at the first `import scipy.stats`"
    cause: >-
      Login and compute nodes both report 128 CPUs. OpenBLAS and MKL size their
      thread pool when the shared library loads, defaulting to one thread per
      core, and on a machine this wide that initialisation stalls. The cluster
      also puts Intel oneAPI MKL on LD_LIBRARY_PATH by default, so scipy may
      bind to MKL rather than OpenBLAS.
    fix: >-
      OMP_NUM_THREADS, OPENBLAS_NUM_THREADS, MKL_NUM_THREADS,
      NUMEXPR_NUM_THREADS and VECLIB_MAXIMUM_THREADS are capped in
      tests/conftest.py (before any import), scripts/cluster/setup_env.sh and
      slurm/templates/_common.sh. Inside Slurm the cap follows
      SLURM_CPUS_PER_TASK rather than a fixed number.
    cost: >-
      None for this project. The workload is I/O plus small statistics; no step
      is numerically parallel enough to benefit from 128 BLAS threads.

  login_node_gpu_policy:
    gpu_access_blocked: true
    consequence: >-
      `torch.cuda.is_available()` BLOCKS here rather than returning False, which
      hung the test suite once torch was installed. Provenance collection now
      probes CUDA only inside an allocation that was granted devices
      (semintegrity.inference.provenance.cuda_probe_allowed).
  cuda_version: "12.8 (module)"
  driver_version: UNKNOWN_ON_LOGIN_NODE   # nvidia-smi is blocked here by policy
  python_available: "3.13.7 via module, 3.6.8 system"
  r_available: false                   # RESOLVES Q8 -> PyMC is the GLMM backend (ADR-0004)          # determines the GLMM backend decision (Q8)

network:
  login_node_internet: true     # VERIFIED 2026-09-25
  reachability:
    "https://query.wikidata.org": "HTTP 200"
    "https://www.wikidata.org": "HTTP 301"
    "https://huggingface.co": "HTTP 200"
  compute_node_internet: false     # VERIFIED 2026-09-25 on csis.cn4
  compute_node_evidence: >-
    `curl https://huggingface.co` from inside an allocation returned HTTP 000
    and curl exit code 6 (could not resolve host). DNS does not resolve on
    compute nodes.
  compute_node_consequence: >-
    Confirms the architecture rather than challenging it. Compute jobs already
    run with HF_HUB_OFFLINE=1 (slurm/templates/_common.sh) and read a FROZEN
    knowledge-base cache (ADR-0011). Every weight and every KB fact MUST be
    fetched on the login node first; a job that needs the network will fail,
    not hang.
  proxy_required: false
  implication: >-
    The login node reaches both Wikidata and Hugging Face, so §4.13's plan holds
    exactly: cache weights and the KB snapshot from a non-GPU session, then run
    compute jobs offline.
  mitigation: "KB snapshot + model weights are cached on the login node so compute jobs need NO network"

account_limits:
  # From `sacctmgr show associations user=yashsinha`, 2026-09-25.
  # AccountingStorageEnforce = associations,limits -> these ARE enforced.
  account: faculty
  GrpTRES:
    cpu: 64
    gres_gpu: 2          # RE-OBSERVED 2026-10-14: was recorded as 3 on 2026-09-25.
                         # `sacctmgr -P show association where user=yashsinha`
                         # returns cpu=64,gres/gpu=2,mem=128G. The limit TIGHTENED;
                         # anything sized against 3 GPUs is wrong.
    mem: 128G
  MaxTRES:
    gres_gpu: 2          # per-JOB ceiling, same value. tp=2 is therefore the
                         # largest parallelism this account can ever request.
  MaxJobs: 5
  qos_listed: [cpu-short, debug]
  fairshare: {raw_shares: 1, norm_shares: 0.0526, fairshare_factor: 0.1905}

  shared_pool_warning: >-
    GrpTRES is a GROUP limit across the WHOLE `faculty` account, which several
    students share. If a labmate is using 2 GPUs, only 1 remains for us. Likewise
    MaxJobs=5 is 5 jobs for everyone, not 5 each. Coordinate before launching
    anything large, and prefer array jobs throttled with `%N`.

  unusable_nodes:
    csis.mn1:
      status: DO_NOT_TARGET        # observed 2026-10-15, job 14962
      symptom: >-
        Ships an nvidia-smi WRAPPER that prints "GPU ACCESS RESTRICTED / Please
        use Slurm for GPU-based job executions!" and exits non-zero EVEN INSIDE
        a Slurm job holding a real allocation (gpus_on_node=1,
        CUDA_VISIBLE_DEVICES=0). Killed the job in 2 s during provenance
        capture, before any preflight.
      why_it_looks_attractive: >-
        It is the only node sinfo ever reports as `idle` with both A100s free,
        precisely BECAUSE nobody can use it. Do not read that idleness as
        availability.
      note: "`_common.sh` now guards nvidia-smi so this can no longer be fatal, but the node still cannot run GPU work."
    csis.cn2:
      status: DO_NOT_TARGET
      symptom: "State=drained (observed 2026-10-15); 0/0/128 CPUs, unavailable."

  gpu_contention_hazard:
    status: OBSERVED              # 2026-10-15, jobs 14935 and 14956
    symptom: >-
      torch._C._cuda_init() -> "RuntimeError: Unexpected error from
      cudaGetDeviceCount()... Error 2: out of memory", raised at MODULE IMPORT
      time inside vllm/v1/attention/backends/flash_attn.py, ~30-48 s in, before
      any weight is read.
    not_the_cause: >-
      NOT the --mem request. Reproduced identically at 32G and 64G, with MaxRSS
      of 1.1 MB and 1.6 GiB respectively -- orders of magnitude below either
      ceiling. Sizing --mem on MaxRSS was a separate, now-corrected mistake.
    likely_cause: >-
      ConstrainDevices=no on this cluster, so cgroups do NOT fence GPUs between
      jobs. A co-tenant process holding the allocated A100 leaves too little
      memory for CUDA to create a context, and gpu_memory_utilization=0.90 needs
      ~90% of the card free.
    mitigation: >-
      slurm/30_primary_one_model.sbatch preflight 0 now runs nvidia-smi, records
      which processes are on the card, and refuses with exit 9 when less than 80%
      of GPU memory is free. The run is not spent, and the log says how full the
      card was -- without that, a failure cannot be diagnosed after the fact.

  hard_consequences:
    - "mem must never exceed 128G in any single request — the earlier 256G plan for the 70B was impossible"
    - "mem is an AGGREGATE limit across the whole faculty account. Two 64G jobs
       sum to exactly 128G and leave nothing for anyone else; that is why jobs
       13032/13033 pended 8 h with Reason=AssocGrpMemLimit on 2026-10-08."
    - "at most 2 GPUs total (not 3). Llama-3.3-70B at tp=2 uses the ENTIRE account
       GPU allowance, so no other GPU job of ours can run beside it."
    - "cpus-per-task summed across running jobs must stay under 64"

  qos_gpu_access:
    status: VERIFIED_WORKING          # 2026-09-25
    evidence: "srun --partition=gpu-short --gres=gpu:1 nvidia-smi succeeded on csis.cn4"
    note: >-
      The QOS column listing only cpu-short/debug does NOT block the gpu-*
      partitions. Tested rather than assumed.

resource_plan:     # sized against the REAL limits above
  small_models:    # <= 14B, bf16, tp=1 — one A100 80GB is ample
    models: [qwen25-3b, qwen25-7b, qwen25-14b, mistral7b-v03, olmo2-7b]
    # ROSTER REDUCED 2026-10-15; retired configs in configs/models/retired/.
    partition: gpu-short          # 8 h limit; plenty for a pilot
    gpus: 1
    gres: "gpu:a100-80gb:1"
    cpus_per_task: 4              # 8 -> 4 on 2026-10-15. GrpTRES cpu=64 is an
                                  # AGGREGATE account cap and job 14958 sat at
                                  # (AssocGrpCpuLimit) behind ~80 co-tenant array
                                  # jobs. Inference is GPU-bound and decoding is
                                  # greedy, so CPU count changes speed, not tokens.
    time: "01:30:00"              # 06:00 -> 01:30. Job 13023 ran all 960 primary
                                  # probes on a 3B in 00:01:47; a 6 h reservation
                                  # cannot backfill where a 90 min one can.
    mem: 64G                      # MEASURED 2026-10-15 across three COMPLETED runs:
                                  #   3B  MaxRSS 2.64 GiB / VSZ 30.5 GiB
                                  #   7B  MaxRSS 4.16 GiB / VSZ 39.6 GiB
                                  #   mistral MaxRSS 3.18 GiB / VSZ 98.3 GiB
                                  # The last row is decisive: 98 GiB of VIRTUAL
                                  # memory COMPLETED under a 64G request, so --mem
                                  # does NOT cap VSZ here. An earlier note claimed
                                  # it did and blamed the 32G failure of job 14935
                                  # on it; that was WRONG -- the cause was GPU
                                  # contention (see gpu_contention_hazard). RSS is
                                  # the binding quantity and is only 3-4 GiB, so
                                  # 64G is generous headroom, retained because it
                                  # is proven rather than because it is required.
  ceiling_model:   # RETIRED 2026-10-15 -- kept for the record only.
    # llama33-70b needs 141 GB of weights against ~52 GB of usable quota on a
    # SHARED 1 TB account, so it could never be staged. Dropping it narrows the
    # within-family scale axis from 3B-70B (23x) to 3B-14B (4.7x); the study can
    # say nothing about frontier scale and must state that explicitly.
    status: RETIRED
    models: [llama33-70b]
    partition: gpu-1day           # 24 h limit
    gpus: 2
    gres: "gpu:a100-80gb:2"
    tensor_parallel_size: 2
    cpus_per_task: 16
    mem: 120G                     # CORRECTED from 256G — the group cap is 128G.
                                  # STILL UNMEASURED and almost certainly far too
                                  # high: 120G of a 128G shared pool means the 70B
                                  # can never run beside anything. RE-DERIVE from
                                  # the qwen25-14b MaxRSS before submitting it;
                                  # tp=2 roughly doubles host RSS, so ~48G is the
                                  # expected order, not 120G. Not changed here
                                  # because nothing has measured it yet.
    time: "12:00:00"
  nli_d2:
    partition: gpu-short
    gpus: 1
    cpus_per_task: 8
    mem: 32G
    time: "02:00:00"
  judge_d3:        # microsoft/phi-4, 14B bf16
    partition: gpu-long
    gpus: 1
    cpus_per_task: 8
    mem: 64G
    time: "08:00:00"
