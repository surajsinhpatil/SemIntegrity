# Cluster policy, quoted from the login banner:
#   "All users are requested to execute their jobs using Slurm job files,
#    rather than running them directly on the node's terminal console."
# This matches scripts/_guard_login_node.sh exactly.
hard_rules:
  login_node_allowed:   [edit_files, git, lightweight_commands, squeue_sacct, sbatch]
  login_node_forbidden: [model_inference, model_download, nli_scoring, glmm_fitting, any_gpu_work]
  never_modify: [other_users_folders, shared_environments, system_packages, cluster_wide_config]
  enforcement: >-
    scripts/_guard_login_node.sh is sourced by every heavy script and aborts if
    it detects it is running on the login node without SLURM_JOB_ID set.

