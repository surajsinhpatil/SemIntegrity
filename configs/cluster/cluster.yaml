fallback:          # §4.13 documented fallback
  status: not_active
  description: "managed notebook env up to 14B bf16; one rented 80GB GPU with 4-bit for the 70B ceiling"
  required_if_activated:
    - "quantisation ablation: Qwen2.5-14B at 4-bit on the primary set, to measure quantisation's effect on PSCR"
