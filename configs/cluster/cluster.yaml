shared_account_rules:
  # A shared account means "my files" and "the account's files" are different
  # things. Everything this project creates stays inside work_dir.
  - "write ONLY inside work_dir; never elsewhere in /nfs_home/users/yashsinha/"
  - "never modify the account's shared dotfiles (~/.bashrc, ~/.ssh/config, ~/.condarc)"
  - "the Python environment lives inside work_dir, not in ~/.conda or ~/miniconda3"
  - "HF_HOME is forced to ${work_dir}/hf_cache (already set in slurm/templates/_common.sh)"
  - "`squeue -u yashsinha` shows OTHER people's jobs too — filter by the semint- job-name prefix"
  - "Slurm quotas, GPU-hours and disk are SHARED with everyone on this account"
  - "never scancel a job you did not submit"
  # Observed 2026-09-25: the account's home holds several students' folders
  # (F20220612_Aadit, H20250063_Swayam, P20260107_Vineet, P20260809_Harsh,
  # Ashutosh, kaggri, scratch, pylibs). Confirms this is genuinely shared.

login_security:
  # 2026-09-25: repeated failed logins (wrong username) triggered an IP block.
  incident: "source IP 172.17.84.163 blocked after failed auth; REJECT escalated to DROP"
  lesson: "confirm the username BEFORE attempting; each retry can extend the ban"
  remedy: "wait, or ask the CSIS admin to clear the fail2ban entry for the source IP"


# Cluster policy, quoted from the login banner:
#   "All users are requested to execute their jobs using Slurm job files,
#    rather than running them directly on the node's terminal console."
# This matches scripts/_guard_login_node.sh exactly.
hard_rules:
  login_node_allowed:   [edit_files, git, lightweight_commands, squeue_sacct, sbatch]
  login_node_forbidden: [model_inference, model_download, nli_scoring, glmm_fitting, any_gpu_work]
  never_modify: [other_users_folders, shared_environments, system_packages, cluster_wide_config]
  enforcement: >-
    scripts/_guard_login_node.sh is sourced by every heavy script and aborts if
    it detects it is running on the login node without SLURM_JOB_ID set.

partitions:        # filled by probe_cluster.sh (sinfo)
  status: UNKNOWN
  discovered: []

gpus:              # filled by probe_cluster.sh
  status: UNKNOWN
  discovered: []

storage:
  quota_gb: UNKNOWN
  # Weights needed if all 7 models are cached in bf16 (estimates):
  #   3B ~7 + 7B ~16 + 7B ~15 + 8B ~16 + 9B ~19 + 14B ~30 + 70B ~141  =  ~244 GB
  estimated_weights_gb: 244
  hf_home: "${WORK_DIR}/hf_cache"
  note: "weights are cached ONCE from a non-GPU session, never inside GPU time (§4.13)"

