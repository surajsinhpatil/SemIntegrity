# --- Gemma-2 hazard (§4.6) -------------------------------------------------
# Gemma-2 uses attention logit soft-capping + sliding-window attention. Some
# FlashAttention-2 / vLLM builds silently drop soft-capping and degrade output.
# Silent degradation is INDISTINGUISHABLE from high model inconsistency, which
# would invalidate this model's arm of the study.
hazard:
  requires_logit_softcapping: true
  requires_sliding_window_attention: true
