  # variant. The theme was WIDENED, never replaced, so this family's already
  # EVIDENCE_VERIFIED C1/C2/C3 cells remain truthful instances and none was
  # re-authored. Evidence is Wikidata-only and read by declared checks
  # (ADR-0020). axis 3 / biology is NOT here: it has no admissible replacement.
  # =====================================================================

  - family_id: F-BIO-11
    domain: biology
    theme: "the designated reference standard for a taxon"
    constraints:
      - constraint_id: K-C4-BIO-11
        schema_id: S-C4-01
        class: C4
        formal_predicate: s_c4_01
        constraint_text: >-
          Temporal: the reference standard designated for the human genome is
          interval-bounded — GRCh38 was published on 17 December 2013 and
          superseded GRCh37 of 27 February 2009, so the designated assembly
          differs by date.
        logical_form: "reference_assembly_at(Homo sapiens, 2015) = ?x ; 2015 within validity(GRCh38)"
        gold_proposition: >-
          The reference genome assembly designated for Homo sapiens in 2015 was
          GRCh38.
        answer_type: entity
        answer_space: ["GRCh38", "GRCh37", "NCBI36"]
        gold_answer: "GRCh38"
        answer_aliases:
          "GRCh38": ["Genome Reference Consortium Human Build 38", "hg38"]
        entities:
          - {label: "Homo sapiens", qid: Q15978631}
          - {label: "genome assembly GRCh38", qid: Q20966585}
        temporal_validity:
          start: "2013-12-17"
          end: null
          end_unknown: true
          precision: day
        evidence_checks:
          - {kind: claim_literal, subject_qid: Q20966585, property: P577,
             expect_value: "+2013-12-17T00:00:00Z",
             description: "the interval start — GRCh38 (Q20966585) publication date (P577) = 2013-12-17"}
          - {kind: claim, subject_qid: Q20966585, property: P703, expect_qid: Q15978631,
             description: "the assembly is OF this taxon — GRCh38 (Q20966585) found in taxon (P703) -> Homo sapiens (Q15978631)"}
          - {kind: claim_literal, subject_qid: Q21067546, property: P577,
             expect_value: "+2009-02-27T00:00:00Z",
             description: "the superseded bearer — GRCh37 (Q21067546) P577 = 2009-02-27, which is why the answer depends on the date"}
          - {kind: claim, subject_qid: Q21067546, property: P703, expect_qid: Q15978631,
             description: "the superseded bearer is OF the same taxon — GRCh37 (Q21067546) P703 -> Homo sapiens (Q15978631)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Which human genome assembly superseded GRCh37?", answer_type: entity, gold_answer: "GRCh38"}
        surface:
          subject_formal: "the human reference genome in 2015"
          subject_colloquial: "the human genome reference back in 2015"
          relation_formal: "designated assembly"
          relation_colloquial: "assembly in use"
          object: "GRCh38"
          question_word: "Which assembly"
        ambiguity_notes: >-
          THE TIME INDEX IS LOAD-BEARING AND IS IN THE SUBJECT. GRCh37 was the
          designated human reference assembly from 2009-02-27 until GRCh38
          replaced it on 2013-12-17, so the same question answers GRCh37 for
          2010 and GRCh38 for 2015. Both publication dates are machine-verified,
          and both assemblies are tied to Homo sapiens by P703, so the role and
          its two bearers are checked rather than asserted. RE-THEMED under Q29:
          this family's C1/C2/C3 cells are the type species of Felis, which is
          the NOMENCLATURAL reference standard for that genus name, and a
          reference genome assembly is the SEQUENCE reference standard for a
          species — both instances of the widened theme. The older NCBI36/hg18
          build is the distractor; it is a real assembly but was superseded
          before the queried year. Neither assembly item carries a sitelink,
          which is recorded because entity familiarity is a covariate (§4.3).
          Corroboration required (C4) and not attached. DRAFT.

  - family_id: F-BIO-12
    domain: biology
    theme: "category membership of a vertebrate taxon"
    constraints:
      - constraint_id: K-C4-BIO-12
        schema_id: S-C4-02
        class: C4
        formal_predicate: s_c4_02
        constraint_text: >-
          Temporal: the southern elephant seal's threat-category membership holds
          only over an interval — it was assessed as nationally critical at the
          2024 New Zealand Threat Classification System round, and a category is
          held only between assessments.
        logical_form: "member_at(southern elephant seal, nationally critical, 2024) ; valid(assessment, 2024)"
        gold_proposition: >-
          At the 2024 New Zealand Threat Classification System assessment the
          southern elephant seal was listed as nationally critical.
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: "southern elephant seal", qid: Q215343}
          - {label: "nationally critical", qid: Q108449606}
        temporal_validity:
          start: "2024-01-01"
          end: null
          end_unknown: true
          precision: year
        evidence_checks:
          - {kind: claim, subject_qid: Q215343, property: P9888, expect_qid: Q108449606,
             description: "the category itself — southern elephant seal (Q215343) NZTCS conservation status (P9888) -> nationally critical (Q108449606)"}
          - {kind: claim_point_in_time, subject_qid: Q215343, property: P9888,
             value_qid: Q108449606, expect_year: 2024,
             description: "the time index — P585 point in time on that NZTCS statement is 2024"}
          - {kind: claim, subject_qid: Q215343, property: P171, expect_qid: Q185231,
             description: "the subject is a vertebrate taxon — Q215343 parent taxon (P171) -> Mirounga (Q185231)"}
          - {kind: claim_point_in_time, subject_qid: Q129026, property: P9888,
             value_qid: Q108449541, expect_year: 2024,
             description: "contrast at the SAME date — the great white shark (Q129026) was nationally ENDANGERED, not critical, in the 2024 round"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Is the southern elephant seal a mammal?", answer_type: boolean, gold_answer: "YES"}
        surface:
          claim_formal: "at the 2024 NZTCS assessment the southern elephant seal was listed as nationally critical"
          claim_colloquial: "in the 2024 New Zealand threat listing the southern elephant seal came out as nationally critical"
          claim_reverse_formal: "the southern elephant seal was assessed as nationally critical in the 2024 NZTCS round"
          claim_reverse_colloquial: "New Zealand's 2024 listing rated the southern elephant seal nationally critical"
        ambiguity_notes: >-
          THE TIME INDEX IS LOAD-BEARING. An NZTCS category is an ASSESSMENT, not
          a standing property: it carries a P585 point-in-time qualifier and no
          validity interval, which is why this cell is evidenced by
          `claim_point_in_time` (ADR-0020), and it holds only until the next
          round. The date is not decorative — the contrast check shows a
          different vertebrate assessed in the SAME 2024 round under a DIFFERENT
          category, so the pairing of date and category is what is asserted.
          THE CATEGORIES ARE DISJOINT, which is what makes this an axis-2 cell:
          "nationally critical" and "nationally endangered" are distinct NZTCS
          categories and no taxon holds both in one round. This is a NEW ZEALAND
          national listing, NOT a global IUCN status, and that scope is in the
          claim. RE-THEMED under Q29: this family's C1/C2/C3 cells are
          taxonomic class membership (bats are mammals), and a threat category
          is likewise a category membership of a vertebrate taxon — both
          instances of the widened theme, and taxonomic class membership carries
          no date anywhere in Wikidata. Corroboration required (C4) and not
          attached. DRAFT.

  - family_id: F-SCI-11
    domain: science_technology
    theme: "the designated standard for a physical quantity"
    constraints:
      - constraint_id: K-C4-SCI-11
        schema_id: S-C4-01
        class: C4
        formal_predicate: s_c4_01
        constraint_text: >-
          Temporal: the physical standard designated to define the metre is
          interval-bounded — the International Prototype Metre served from 1879
          and was abolished in 1960, when a krypton-86 wavelength definition
          replaced it, so the designated standard differs by date.
        logical_form: "defining_standard_at(metre, 1950) = ?x ; 1950 within validity(International Prototype Metre)"
        gold_proposition: >-
          In 1950 the metre was defined by the International Prototype Metre.
        answer_type: entity
        answer_space: ["International Prototype Metre", "krypton-86 wavelength standard", "International Prototype of the Kilogram"]
        gold_answer: "International Prototype Metre"
        answer_aliases:
          "International Prototype Metre": ["international prototype of the metre", "the prototype metre bar"]
        entities:
          - {label: "International Prototype Metre", qid: Q1929537}
          - {label: metre, qid: Q11573}
        temporal_validity:
          start: "1879-01-01"
          end: "1960-01-01"
          end_unknown: false
          precision: year
        evidence_checks:
          - {kind: claim_literal, subject_qid: Q1929537, property: P571,
             expect_value: "+1879-00-00T00:00:00Z",
             description: "the interval start — International Prototype Metre (Q1929537) inception (P571) = 1879, recorded only to the year"}
          - {kind: claim_literal, subject_qid: Q1929537, property: P576,
             expect_value: "+1960-00-00T00:00:00Z",
             description: "the interval END — Q1929537 dissolved/abolished (P576) = 1960, which is what makes the bearer date-dependent"}
          - {kind: claim, subject_qid: Q11573, property: P31, expect_qid: Q223662,
             description: "the quantity's unit is an SI base unit — metre (Q11573) instance of (P31) -> SI base unit (Q223662)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which year was the International Prototype Metre abolished as the definition of the metre?", answer_type: date, gold_answer: "1960"}
        surface:
          subject_formal: "the metre in 1950"
          subject_colloquial: "the metre back in 1950"
          relation_formal: "defining standard"
          relation_colloquial: "what defined it"
          object: "International Prototype Metre"
          question_word: "Which standard"
        ambiguity_notes: >-
          THE TIME INDEX IS LOAD-BEARING AND IS IN THE SUBJECT. The
          International Prototype Metre defined the metre from 1879 until its
          abolition in 1960, when the 11th CGPM adopted the krypton-86 wavelength
          definition; the same question therefore answers differently for 1950
          and for 1970, and the 1983 speed-of-light definition is later still.
          BOTH BOUNDARIES ARE MACHINE-VERIFIED from P571 and P576, which is the
          case ADR-0020 was written for: the artefact's end of service is carried
          by a direct date property, not by a statement qualifier. Both dates are
          recorded only to the year, so temporal_validity is year-precision and
          the 1960 boundary is not claimed to a day. RE-THEMED under Q29: this
          family's C1/C2/C3 cells assert that the SI base unit of length is the
          metre, and an SI base unit is a designated standard for a physical
          quantity — both instances of the widened theme. The distractor
          International Prototype of the Kilogram is the mass artefact, which was
          NOT abolished in 1960 and remained in service until 2019; it is the
          trap for a reader who remembers that a prototype artefact was retired
          but not which one. Corroboration required (C4) and not attached.
          DRAFT.

  - family_id: F-GEO-15
    domain: geography
    theme: "the highest summit of a named region"
    constraints:
      - constraint_id: K-C4-GEO-15
        schema_id: S-C4-05
        class: C4
        formal_predicate: s_c4_05
        constraint_text: >-
          Temporal: the comparison set is restricted to a named interval — within
          the territory of the Soviet Union, which existed from 30 December 1922
          until 26 December 1991, the highest summit was the peak now called
          Ismoil Somoni.
        logical_form: "argmax(elevation, summits_within(USSR), window=[1922-12-30, 1991-12-26]) = Ismoil Somoni Peak"
        gold_proposition: >-
          The highest summit within the territory of the Soviet Union was the
          peak now called Ismoil Somoni Peak.
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: "Ismoil Somoni Peak", qid: Q41413}
          - {label: "Lenin Peak", qid: Q838587}
          - {label: "Soviet Union", qid: Q15180}
        temporal_validity:
          start: "1922-12-30"
          end: "1991-12-26"
          end_unknown: false
          precision: day
        comparison_universe:
          universe: >-
            the highest summits lying within the territory of the Soviet Union,
            as enumerated
          membership_rule: >-
            Enumerated: the summits named in `members`. Soviet-territory
            membership is machine-checked two ways, because Wikidata records
            present-day countries on most summits: Lenin Peak and Khan Tengri
            carry P17 -> Q15180 (Soviet Union) DIRECTLY, while Ismoil Somoni Peak
            and Jengish Chokusu carry P17 -> a state the Soviet Union was
            replaced by (Q15180 P1366 -> Q863 Tajikistan, Q813 Kyrgyzstan). The
            set is an enumeration rather than a live query, so the universe is
            frozen with the record.
          measure: "elevation above sea level (P2044), in metres"
          direction: max
          argmax_qid: Q41413
          argmax_label: "Ismoil Somoni Peak"
          frozen_at: "2026-10-08"
          members:
            - {label: "Ismoil Somoni Peak", qid: Q41413, measure_value: "7495 metre"}
            - {label: "Jengish Chokusu", qid: Q332762, measure_value: "7439 metre"}
            - {label: "Lenin Peak", qid: Q838587, measure_value: "7134 metre"}
            - {label: "Khan Tengri", qid: Q211529, measure_value: "7010 metre"}
          note: >-
            Every measure was read from Wikidata P2044 before this universe was
            written. The enumeration is not a claim to exhaustiveness over all
            Soviet summits; it is the comparison set this constraint ranges over,
            as in this family's C1 cell. The time WINDOW, not the measure, is
            what makes this the C4 variant: the same four summits exist today,
            but the territory that bounded the set does not.
        evidence_checks:
          - {kind: claim_literal, subject_qid: Q41413, property: P2044, expect_value: "7495",
             description: "the asserted maximum — Ismoil Somoni Peak (Q41413) elevation (P2044) = 7495 m"}
          - {kind: claim, subject_qid: Q41413, property: P17, expect_qid: Q863,
             description: "bearer's territory — Q41413 country (P17) -> Tajikistan (Q863)"}
          - {kind: claim, subject_qid: Q15180, property: P1366, expect_qid: Q863,
             description: "Tajikistan is a Soviet successor — Soviet Union (Q15180) replaced by (P1366) -> Q863, which places the bearer inside the former territory"}
          - {kind: claim_literal, subject_qid: Q15180, property: P576,
             expect_value: "+1991-12-26T00:00:00Z",
             description: "the window's END — Soviet Union (Q15180) dissolved (P576) = 1991-12-26"}
          - {kind: claim, subject_qid: Q838587, property: P17, expect_qid: Q15180,
             description: "comparison member, DIRECT Soviet attribution — Lenin Peak (Q838587) P17 -> Soviet Union (Q15180)"}
          - {kind: claim_literal, subject_qid: Q838587, property: P2044, expect_value: "7134",
             description: "comparison member — Lenin Peak (Q838587) P2044 = 7134 m, below the maximum"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which year did the Soviet Union cease to exist?", answer_type: date, gold_answer: "1991"}
        surface:
          claim_formal: "the highest summit within the territory of the Soviet Union was Ismoil Somoni Peak"
          claim_colloquial: "the tallest mountain in the old Soviet Union was the peak now called Ismoil Somoni"
          claim_reverse_formal: "Ismoil Somoni Peak was the highest summit lying within the Soviet Union"
          claim_reverse_colloquial: "that peak, now called Ismoil Somoni, was the Soviet Union's highest"
        ambiguity_notes: >-
          THE COMPARISON SET IS RESTRICTED TO A NAMED INTERVAL, which is exactly
          what axis 5's C4 variant requires, and the interval's end is
          machine-verified from the Soviet Union's P576. THE PEAK WAS RENAMED:
          it was Stalin Peak from 1932, Communism Peak from 1962, and Ismoil
          Somoni only from 1998 — after the window closed. The present Wikidata
          label is used throughout, and the claim is phrased "the peak now
          called" so that it does not assert the 1991 name; a model answering
          "Communism Peak" is answering the same question and the aliases record
          that. RE-THEMED under Q29: this family's C1/C2/C3 cells range over
          summits wholly within Africa, and a continent is a named region just as
          a former state is — both instances of the widened theme. The Revision-4
          theme could not host this cell because summit ELEVATIONS carry no
          interval in Wikidata; scoping the SET to a polity with a recorded end
          date supplies the interval the axis needs without dating any
          elevation. Corroboration required (C4) and not attached. DRAFT.

  # =====================================================================
  # BATCH 5 — the Q29 axis-3/biology C4 cell (coverage matrix Revision 6).
  # Taxonomic P171 carries no date qualifiers anywhere in Wikidata, but the
  # SUPERSEDED placement is dated: the original combination (P1403) is its own
  # taxon item, its P225 carries a P574 publication-year qualifier, and its
  # P171 names the ORIGINAL genus. So the containing taxon differs by date
  # without any date being inferred. Read by `claim_qualifier_time` (ADR-0020).
  - family_id: F-BIO-13
    domain: biology
    theme: "a taxon within a higher taxon"
    constraints:
      - constraint_id: K-C4-BIO-13
        schema_id: S-C4-03
        class: C4
        formal_predicate: s_c4_03
        constraint_text: >-
          Temporal: the genus containing the lion differs by date — the species
          was published as Felis leo in the genus Felis in 1758 and is now placed
          in Panthera, so the containing taxon depends on which circumscription
          is being asked about.
        logical_form: "in_at(lion, ?x, 1758) = Felis ; in_now(lion) = Panthera"
        gold_proposition: >-
          The genus in which the lion was originally described, in 1758, is
          Felis.
        answer_type: entity
        answer_space: ["Felis", "Panthera", "Pantherinae"]
        gold_answer: "Felis"
        answer_aliases:
          "Felis": ["genus Felis"]
        entities:
          - {label: lion, qid: Q140}
          - {label: "Felis leo", qid: Q15294488}
          - {label: Felis, qid: Q228283}
        temporal_validity:
          start: "1758-01-01"
          end: null
          end_unknown: true
          precision: year
        evidence_checks:
          - {kind: claim, subject_qid: Q140, property: P1403, expect_qid: Q15294488,
             description: "the superseded placement — lion (Q140) original combination (P1403) -> Felis leo (Q15294488)"}
          - {kind: claim, subject_qid: Q15294488, property: P171, expect_qid: Q228283,
             description: "the ORIGINAL containing genus — Felis leo (Q15294488) parent taxon (P171) -> Felis (Q228283)"}
          - {kind: claim_qualifier_time, subject_qid: Q15294488, property: P225,
             value_literal: "Felis leo", qualifier_property: P574, expect_year: 1758,
             description: "the date — P574 publication-year qualifier on Q15294488's P225 is 1758"}
          - {kind: claim, subject_qid: Q140, property: P171, expect_qid: Q127960,
             description: "the PRESENT containing genus — lion (Q140) P171 -> Panthera (Q127960), which is what makes the answer date-dependent"}
          - {kind: claim_cardinality, subject_qid: Q140, property: P171, expect_count: 1,
             description: "the lion has exactly one current parent taxon, so the present placement is unambiguous"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which genus is the lion placed today?", answer_type: entity, gold_answer: "Panthera"}
        surface:
          subject_formal: "the lion as originally described in 1758"
          subject_colloquial: "the lion as it was first named back in 1758"
          relation_formal: "containing genus"
          relation_colloquial: "genus it was put in"
          object: "Felis"
          question_word: "Which genus"
        ambiguity_notes: >-
          THE TIME INDEX IS LOAD-BEARING AND IS IN THE SUBJECT. Linnaeus
          published the lion as Felis leo in 1758; it now sits in Panthera, so
          the same question answers Felis for 1758 and Panthera for today, and
          both placements are machine-verified. THE TRANSFER DATE IS NOT
          RECORDED AND IS NOT INVENTED: Wikidata dates the publication of the
          original combination, not the move to Panthera, which is why
          temporal_validity carries `end: null` with `end_unknown: true` — the
          same treatment K-C4-HIS-12 gives a missing P580. The date is the
          publication year of the NAME, which is what P574 means, and the claim
          says "originally described, in 1758" rather than implying the
          placement itself was dated. RE-THEMED under Q29 (Revision 6): this
          family's C1/C2/C3 cells nest Panthera in Pantherinae in Felidae, and
          this cell nests a species in a genus — both are a taxon within a
          higher taxon, which is the widened theme and is also what the dev
          family already did. Pantherinae is the distractor: it is a real
          containing taxon of the lion, but a subfamily and never the genus.
          Corroboration required (C4) and not attached. DRAFT.
