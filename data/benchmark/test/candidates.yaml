# ===========================================================================
# TEST SPLIT CANDIDATES — Batch 1, trial family. ALL DRAFT.
#
# Authored against data/benchmark/authoring_manifest.json and the Revision 3
# matrix. Cell allocation is NOT chosen here: it is read off the manifest.
#
# QIDs and property values below are the AUTHOR'S CANDIDATE identifications.
# They are CHECKED by the evidence fetcher, never trusted. A wrong QID or a
# wrong expected value surfaces as failed evidence and the constraint stays
# DRAFT. No sitelink count, observed value or retrieval date is written by
# hand; all of those come from the fetcher.
# ===========================================================================
meta:
  authored_at: "2026-10-07"
  authored_by: "assistant draft — pending researcher review"
  split: test
  tier: primary
  batch: 1
  probes_per_constraint: 8
  answer_type_rule: "ADR-0017 as amended 2026-10-07 — (axis, class); C2/C3 boolean"

families:

  # =====================================================================
  # F-GEO-11 · axis 1 "Unique designated role-bearer" · geography · entity
  # Manifest theme: "the capital city of a country".
  # Entities are disjoint from the pilot's (Australia/Canberra), as ADR-0007
  # requires of anything sharing a schema with dev.
  - family_id: F-GEO-11
    domain: geography
    theme: "the capital city of Brazil"
    constraints:

      - constraint_id: K-C1-GEO-11
        schema_id: S-C1-01
        class: C1
        formal_predicate: s_c1_01
        constraint_text: "A sovereign state has exactly one capital city; the capital of Brazil is Brasília."
        logical_form: "capital_of(Brazil) = ?x"
        gold_proposition: "The capital city of Brazil is Brasília."
        answer_type: entity
        answer_space: ["Brasília", "Rio de Janeiro", "São Paulo"]
        gold_answer: "Brasília"
        answer_aliases:
          "Brasília": ["Brasilia", "Brasília, DF"]
        entities:
          - {label: Brazil, qid: Q155}
          - {label: "Brasília", qid: Q2844}
        evidence_checks:
          - {kind: claim, subject_qid: Q155, property: P36, expect_qid: Q2844,
             description: "Brazil (Q155) capital (P36) -> Brasília (Q2844)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Is Brasília a city in Brazil?", answer_type: boolean, gold_answer: "YES"}
        surface:
          subject_formal: "Brazil"
          subject_colloquial: "Brazil"
          relation_formal: "capital city"
          relation_colloquial: "capital"
          object: "Brasília"
        ambiguity_notes: >-
          Rio de Janeiro and São Paulo are deliberate distractors. Rio was the
          capital until 1960 and is the subject of K-C4-GEO-11; São Paulo is the
          largest city and is never the capital.

      - constraint_id: K-C2-GEO-11
        schema_id: S-C2-01
        class: C2
        formal_predicate: s_c2_01
        constraint_text: >-
          Conjunctive: the city that is the capital of Brazil is also located in the
          Federal District. Both must hold of the same city.
        logical_form: "capital_of(Brazil) = ?x AND located_in(?x) = Distrito Federal"
        gold_proposition: "Brasília is the capital of Brazil and is located in the Federal District."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: Brazil, qid: Q155}
          - {label: "Brasília", qid: Q2844}
          - {label: "Federal District", qid: Q119158}
        evidence_checks:
          - {kind: claim, subject_qid: Q155, property: P36, expect_qid: Q2844,
             description: "conjunct 1 — Brazil (Q155) capital (P36) -> Brasília (Q2844)"}
          - {kind: claim, subject_qid: Q2844, property: P131, expect_qid: Q119158,
             description: "conjunct 2 — Brasília (Q2844) located in (P131) -> Federal District (Q119158)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which federal unit of Brazil is Brasília located?", answer_type: entity, gold_answer: "Federal District"}
        surface:
          claim_formal: "the capital of Brazil is Brasília, and Brasília is located in the Federal District"
          claim_colloquial: "Brazil's capital is Brasília, and it sits in the Federal District"
          claim_reverse_formal: "Brasília is the capital of Brazil and lies within the Federal District"
          claim_reverse_colloquial: "Brasília is Brazil's capital and it's in the Federal District"
        ambiguity_notes: >-
          AXIS-1 C2 CAUTION: a model may answer on the strength of the first
          conjunct alone, which D0 cannot distinguish (N/A-struct).
          CANDIDATE CORRECTED BY THE FETCHER 2026-10-07: the author proposed
          Q119251 for the Federal District; the live lookup of Q2844 P131 returned
          Q119158, which the fetcher then confirmed. The wrong candidate kept the
          constraint DRAFT, exactly as designed.

      - constraint_id: K-C3-GEO-11
        schema_id: S-C3-01
        class: C3
        formal_predicate: s_c3_01
        constraint_text: >-
          Universal: for every city x and sovereign states y, z, if x is the capital of
          y and of z then y = z. Instantiated on Brasília, which is the capital of
          exactly one sovereign state.
        logical_form: "forall x,y,z: capital_of(y,x) AND capital_of(z,x) -> y = z"
        gold_proposition: "Brasília is the capital of exactly one sovereign state, namely Brazil."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "NO"
        entities:
          - {label: "Brasília", qid: Q2844}
          - {label: Brazil, qid: Q155}
        evidence_checks:
          - {kind: claim, subject_qid: Q155, property: P36, expect_qid: Q2844,
             description: "the instantiating claim — Brazil (Q155) capital (P36) -> Brasília (Q2844)"}
          - {kind: sparql_count, query_name: sovereign_states_with_capital,
             query_params: {city: Q2844}, expect_count: 1,
             description: "exactly one sovereign state has Brasília (Q2844) as its capital"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Of which country is Brasília the capital?", answer_type: entity, gold_answer: "Brazil"}
        surface:
          claim_formal: "Brasília is the capital of some sovereign state other than Brazil"
          claim_colloquial: "Brasília is the capital of any country besides Brazil"
          claim_reverse_formal: "some sovereign state other than Brazil has Brasília as its capital"
          claim_reverse_colloquial: "any country besides Brazil has Brasília as its capital"
        ambiguity_notes: >-
          Expected answer is NO. REQUIRES_HUMAN_REVIEW — the universal is
          instantiated on one entity, so a model can answer correctly without
          representing the quantifier, and D0 cannot tell the difference
          (N/A-struct). The uniqueness IS now evidenced, by the registered
          sovereign_states_with_capital count. Class assignment C3 vs C1 remains an
          authoring judgement, exactly as in the pilot's K-C3-GEO-01.

      - constraint_id: K-C4-GEO-11
        schema_id: S-C4-01
        class: C4
        formal_predicate: s_c4_01
        constraint_text: >-
          Temporal: the holder of the capital role for Brazil is interval-bounded.
          Brasília has held it since 1960-04-21; before that date the capital was
          Rio de Janeiro.
        logical_form: "capital_at(Brazil, 1950) = ?x ; 1950 before start(capital_of(Brazil, Brasilia))"
        gold_proposition: "In 1950 the capital of Brazil was Rio de Janeiro."
        answer_type: entity
        answer_space: ["Rio de Janeiro", "Brasília", "São Paulo"]
        gold_answer: "Rio de Janeiro"
        answer_aliases:
          "Rio de Janeiro": ["Rio"]
        entities:
          - {label: Brazil, qid: Q155}
          - {label: "Rio de Janeiro", qid: Q8678}
          - {label: "Brasília", qid: Q2844}
        temporal_validity:
          # start is NULL on purpose: Wikidata records no P580 on Brazil's
          # P36 -> Rio de Janeiro statement, and the author's earlier candidate
          # (1763) had no source. It is not invented back in.
          start: null
          end: "1960-04-22"
          end_unknown: false
          precision: day
        evidence_checks:
          - {kind: claim, subject_qid: Q155, property: P36, expect_qid: Q8678,
             description: "Brazil (Q155) capital (P36) must still list the historical holder Rio de Janeiro (Q8678)"}
          - {kind: claim_interval_end, subject_qid: Q155, property: P36, value_qid: Q8678,
             expect_year: 1960,
             description: "P582 end qualifier on Brazil (Q155) P36 -> Rio de Janeiro (Q8678)"}
          - {kind: claim_interval, subject_qid: Q155, property: P36, value_qid: Q2844,
             expect_year_at_most: 1960,
             description: "P580 start qualifier on Brazil (Q155) P36 -> Brasília (Q2844); Brasília's tenure begins no earlier than 1960, so it was not the capital in 1950"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which year did Brasília become the capital of Brazil?", answer_type: date, gold_answer: "1960"}
        surface:
          # The time index sits in the SUBJECT slot, so the open form reads
          # "The capital city of Brazil in 1950 is ___." The temporal condition is
          # therefore explicit in every probe rather than implied by the gold
          # answer, which is what §4.4 requires of a C4 probe.
          subject_formal: "Brazil in 1950"
          subject_colloquial: "Brazil back in 1950"
          relation_formal: "capital city"
          relation_colloquial: "capital"
          object: "Rio de Janeiro"
          question_word: "Which city"
        ambiguity_notes: >-
          REQUIRES_HUMAN_REVIEW — an inferential step in the gold answer.
          FETCHED: Brazil P36 -> Rio de Janeiro carries P582 = 1960-04-22 and no
          P580; Brazil P36 -> Brasília carries P580 = 1960-04-22. Both are
          machine-verified. The author's earlier candidate dates (end 1960-04-21,
          start 1763) were WRONG and have been replaced by the fetched values.
          WHAT THE SOURCE ESTABLISHES: Rio ceased to be capital in 1960 and
          Brasília began then — so Brasília was not the capital in 1950.
          WHAT IS INFERRED: that Rio WAS the capital in 1950. Wikidata records no
          start for Rio's tenure, so covering 1950 rests on the absence of any
          other P36 value for that period, which is inference rather than a
          positive claim. A human must decide whether that inference is acceptable
          as the gold basis, or whether the probe should be re-scoped to a date
          the source positively covers.
          Corroboration is REQUIRED for this constraint (C4) and is NOT present:
          see the batch report on the missing second-source mechanism.

  # =====================================================================
  # BATCH 2 — 2026-10-07. Four families, axes 1-3, no corroboration
  # required for C1-C3 (ADR-0019 scope). EVERY QID AND VALUE BELOW WAS
  # READ FROM WIKIDATA BEFORE BEING WRITTEN, not guessed and repaired:
  # the recorded candidate error rate of ~1 in 4 is what that policy buys.
  # Where a class has no verifiable temporal interval, the cell is NOT
  # authored rather than given an invented date.
  # =====================================================================

  # F-GEO-13 · axis 3 "Part-whole containment" · geography
  # Manifest theme: "city within a first-level administrative division".
  # Fetched: Yokohama (Q38283) P131 -> Kanagawa Prefecture (Q127513), one
  # value only; Kanagawa (Q127513) P131 -> Japan (Q17). For C4, Munich
  # (Q1726) P131 carries two interval-qualified values: Isarkreis
  # (Q1673724) P580 1808-10-01 / P582 1837-12-31, then Upper Bavaria
  # (Q10562) P580 1837-12-31.
  - family_id: F-GEO-13
    domain: geography
    theme: "city within a first-level administrative division"
    constraints:

      - constraint_id: K-C1-GEO-13
        schema_id: S-C1-03
        class: C1
        formal_predicate: s_c1_03
        constraint_text: >-
          A city lies in exactly one first-level administrative division of its
          country; Yokohama lies in Kanagawa Prefecture.
        logical_form: "located_in_admin1(Yokohama) = ?x"
        gold_proposition: "The prefecture of Japan in which Yokohama is located is Kanagawa Prefecture."
        answer_type: entity
        answer_space: ["Kanagawa Prefecture", "Tokyo", "Osaka Prefecture"]
        gold_answer: "Kanagawa Prefecture"
        answer_aliases:
          "Kanagawa Prefecture": ["Kanagawa", "Kanagawa-ken"]
        entities:
          - {label: "Yokohama", qid: Q38283}
          - {label: "Kanagawa Prefecture", qid: Q127513}
        evidence_checks:
          - {kind: claim, subject_qid: Q38283, property: P131, expect_qid: Q127513,
             description: "Yokohama (Q38283) located in the administrative territorial entity (P131) -> Kanagawa Prefecture (Q127513)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Is Yokohama a city in Japan?", answer_type: boolean, gold_answer: "YES"}
        surface:
          subject_formal: "Yokohama"
          subject_colloquial: "Yokohama"
          relation_formal: "prefecture"
          relation_colloquial: "prefecture"
          object: "Kanagawa Prefecture"
        ambiguity_notes: >-
          Tokyo and Osaka Prefecture are deliberate distractors: both are
          first-level divisions of Japan and neither contains Yokohama. Prefectures
          ARE Japan's first-level divisions, so the theme is satisfied by the direct
          P131 claim with no intermediate level, which is why this family was chosen
          over a German or US city whose P131 points at a second-level district.

      - constraint_id: K-C2-GEO-13
        schema_id: S-C2-03
        class: C2
        formal_predicate: s_c2_03
        constraint_text: >-
          Conjunctive: Yokohama lies in Kanagawa Prefecture and Kanagawa Prefecture
          lies in Japan. Both links of the containment chain must hold.
        logical_form: "located_in(Yokohama) = Kanagawa AND located_in(Kanagawa) = Japan"
        gold_proposition: "Yokohama is located in Kanagawa Prefecture, and Kanagawa Prefecture is located in Japan."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: "Yokohama", qid: Q38283}
          - {label: "Kanagawa Prefecture", qid: Q127513}
          - {label: "Japan", qid: Q17}
        evidence_checks:
          - {kind: claim, subject_qid: Q38283, property: P131, expect_qid: Q127513,
             description: "conjunct 1 — Yokohama (Q38283) P131 -> Kanagawa Prefecture (Q127513)"}
          - {kind: claim, subject_qid: Q127513, property: P131, expect_qid: Q17,
             description: "conjunct 2 — Kanagawa Prefecture (Q127513) P131 -> Japan (Q17)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which country is Kanagawa Prefecture?", answer_type: entity, gold_answer: "Japan"}
        surface:
          claim_formal: "Yokohama is located in Kanagawa Prefecture, and Kanagawa Prefecture is located in Japan"
          claim_colloquial: "Yokohama is in Kanagawa, and Kanagawa is in Japan"
          claim_reverse_formal: "Kanagawa Prefecture contains Yokohama and Japan contains Kanagawa Prefecture"
          claim_reverse_colloquial: "Kanagawa has Yokohama in it, and Japan has Kanagawa in it"
        ambiguity_notes: >-
          AXIS-3 C2 CAUTION: a model may answer on the strength of the first conjunct
          alone, which D0 cannot distinguish from representing the conjunction
          (N/A-struct). Both conjuncts are separately evidenced so the gold does not
          rest on composition.

      - constraint_id: K-C3-GEO-13
        schema_id: S-C3-03
        class: C3
        formal_predicate: s_c3_03
        constraint_text: >-
          Universal: for every city x and prefectures y, z, if x lies in y and in z
          then y = z. Instantiated on Yokohama, which lies in exactly one prefecture.
        logical_form: "forall x,y,z: in(x,y) AND in(x,z) -> y = z"
        gold_proposition: "Yokohama lies in exactly one prefecture of Japan, namely Kanagawa Prefecture."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "NO"
        entities:
          - {label: "Yokohama", qid: Q38283}
          - {label: "Kanagawa Prefecture", qid: Q127513}
        evidence_checks:
          - {kind: claim, subject_qid: Q38283, property: P131, expect_qid: Q127513,
             description: "the instantiating claim — Yokohama (Q38283) P131 -> Kanagawa Prefecture (Q127513)"}
          - {kind: claim_cardinality, subject_qid: Q38283, property: P131, expect_count: 1,
             description: "uniqueness — Yokohama (Q38283) has exactly one P131 statement, so no second containing division exists"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which prefecture is Yokohama?", answer_type: entity, gold_answer: "Kanagawa Prefecture"}
        surface:
          claim_formal: "Yokohama lies in some prefecture of Japan other than Kanagawa Prefecture"
          claim_colloquial: "Yokohama is in some other prefecture besides Kanagawa"
          claim_reverse_formal: "some prefecture of Japan other than Kanagawa Prefecture contains Yokohama"
          claim_reverse_colloquial: "a prefecture other than Kanagawa has Yokohama in it"
        ambiguity_notes: >-
          Expected answer is NO. REQUIRES_HUMAN_REVIEW — the universal is
          instantiated on one entity, so a model can answer correctly without
          representing the quantifier and D0 cannot tell the difference
          (N/A-struct). The uniqueness IS evidenced, by the P131 cardinality check,
          rather than assumed.

      - constraint_id: K-C4-GEO-13
        schema_id: S-C4-03
        class: C4
        formal_predicate: s_c4_03
        constraint_text: >-
          Temporal: Munich's containing administrative district is interval-bounded.
          Munich lay in the Isarkreis from 1808-10-01 until 1837-12-31, after which
          the district was reconstituted as Upper Bavaria.
        logical_form: "located_in_at(Munich, 1820) = ?x ; 1820 within [start, end] of in(Munich, Isarkreis)"
        gold_proposition: "In 1820 the administrative district in which Munich lay was the Isarkreis."
        answer_type: entity
        answer_space: ["Isarkreis", "Upper Bavaria", "Bavaria"]
        gold_answer: "Isarkreis"
        entities:
          - {label: "Munich", qid: Q1726}
          - {label: "Isarkreis", qid: Q1673724}
          - {label: "Upper Bavaria", qid: Q10562}
        temporal_validity:
          start: "1808-10-01"
          end: "1837-12-31"
          end_unknown: false
          precision: day
        evidence_checks:
          - {kind: claim, subject_qid: Q1726, property: P131, expect_qid: Q1673724,
             description: "Munich (Q1726) P131 must still list the historical holder Isarkreis (Q1673724)"}
          - {kind: claim_interval, subject_qid: Q1726, property: P131, value_qid: Q1673724,
             expect_year_at_most: 1820,
             description: "P580 start qualifier on Munich (Q1726) P131 -> Isarkreis (Q1673724) is no later than 1820, so the Isarkreis already contained Munich in 1820"}
          - {kind: claim_interval_end, subject_qid: Q1726, property: P131, value_qid: Q1673724,
             expect_year: 1837,
             description: "P582 end qualifier on Munich (Q1726) P131 -> Isarkreis (Q1673724)"}
          - {kind: claim_interval, subject_qid: Q1726, property: P131, value_qid: Q10562,
             expect_year_at_most: 1837,
             description: "P580 start qualifier on Munich (Q1726) P131 -> Upper Bavaria (Q10562); Upper Bavaria's tenure begins no earlier than the Isarkreis's end, so it did not contain Munich in 1820"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "In which year was the Isarkreis replaced as Munich's administrative district?", answer_type: date, gold_answer: "1837"}
        surface:
          subject_formal: "Munich in 1820"
          subject_colloquial: "Munich back in 1820"
          relation_formal: "administrative district"
          relation_colloquial: "district"
          object: "Isarkreis"
          question_word: "Which district"
        ambiguity_notes: >-
          Both interval boundaries are machine-verified from P580/P582 qualifiers and
          neither is supplied by hand. Upper Bavaria and Bavaria are deliberate
          distractors: Upper Bavaria is the successor district and Bavaria the
          first-level state, so a model that ignores the time index has two plausible
          wrong answers. Corroboration is REQUIRED for this constraint (C4, and a
          temporal axis) and is NOT yet attached, so it stays DRAFT under ADR-0019.

  # F-BIO-13 · axis 3 "Part-whole containment" · biology
  # Manifest theme: "a taxon within a higher taxon".
  # Fetched: Panthera (Q127960) P171 -> Pantherinae (Q230177), one value only;
  # Pantherinae (Q230177) P171 -> Felidae (Q25265); lion (Q140) P171 -> Panthera.
  - family_id: F-BIO-13
    domain: biology
    theme: "a taxon within a higher taxon"
    constraints:

      - constraint_id: K-C1-BIO-13
        schema_id: S-C1-03
        class: C1
        formal_predicate: s_c1_03
        constraint_text: >-
          A genus sits within exactly one family; the genus Panthera sits within the
          family Felidae, by way of the subfamily Pantherinae.
        logical_form: "family_of(Panthera) = ?x"
        gold_proposition: "The family that contains the genus Panthera is Felidae."
        answer_type: entity
        answer_space: ["Felidae", "Canidae", "Ursidae"]
        gold_answer: "Felidae"
        answer_aliases:
          "Felidae": ["the cat family", "cats"]
        entities:
          - {label: "Panthera", qid: Q127960}
          - {label: "Pantherinae", qid: Q230177}
          - {label: "Felidae", qid: Q25265}
        evidence_checks:
          - {kind: claim, subject_qid: Q127960, property: P171, expect_qid: Q230177,
             description: "level 1 — Panthera (Q127960) parent taxon (P171) -> Pantherinae (Q230177)"}
          - {kind: claim, subject_qid: Q230177, property: P171, expect_qid: Q25265,
             description: "level 2 — Pantherinae (Q230177) parent taxon (P171) -> Felidae (Q25265)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "Is Panthera a genus of mammals?", answer_type: boolean, gold_answer: "YES"}
        surface:
          subject_formal: "the genus Panthera"
          subject_colloquial: "the genus Panthera"
          relation_formal: "family"
          relation_colloquial: "family"
          object: "Felidae"
        ambiguity_notes: >-
          Wikidata records Panthera's direct parent taxon as the SUBFAMILY
          Pantherinae, not the family Felidae, so the gold answer rests on
          containment composing over two recorded links rather than on one claim.
          Both links are separately evidenced. That is what axis 3 is about
          ("containment composes"), and the manifest's axis-3 evidence policy asks
          for the containment claim at each level named by the schema. Canidae and
          Ursidae are deliberate distractors: sibling carnivoran families.

      - constraint_id: K-C2-BIO-13
        schema_id: S-C2-03
        class: C2
        formal_predicate: s_c2_03
        constraint_text: >-
          Conjunctive: the lion's genus is Panthera and Panthera's subfamily is
          Pantherinae. Both links must hold.
        logical_form: "genus_of(lion) = Panthera AND subfamily_of(Panthera) = Pantherinae"
        gold_proposition: "The lion belongs to the genus Panthera, and Panthera belongs to the subfamily Pantherinae."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: "lion", qid: Q140}
          - {label: "Panthera", qid: Q127960}
          - {label: "Pantherinae", qid: Q230177}
        evidence_checks:
          - {kind: claim, subject_qid: Q140, property: P171, expect_qid: Q127960,
             description: "conjunct 1 — lion (Q140) parent taxon (P171) -> Panthera (Q127960)"}
          - {kind: claim, subject_qid: Q127960, property: P171, expect_qid: Q230177,
             description: "conjunct 2 — Panthera (Q127960) parent taxon (P171) -> Pantherinae (Q230177)"}
        prerequisite_atomic_facts:
          - {fact_id: F1, question: "To which genus does the lion belong?", answer_type: entity, gold_answer: "Panthera"}
        surface:
          claim_formal: "the lion belongs to the genus Panthera, and Panthera belongs to the subfamily Pantherinae"
          claim_colloquial: "lions are in the genus Panthera, and Panthera is in the Pantherinae subfamily"
          claim_reverse_formal: "the genus Panthera contains the lion and the subfamily Pantherinae contains Panthera"
          claim_reverse_colloquial: "Panthera has the lion in it, and Pantherinae has Panthera in it"
        ambiguity_notes: >-
          AXIS-3 C2 CAUTION: answering on the first conjunct alone is not
          distinguishable from representing the conjunction (N/A-struct).

      - constraint_id: K-C3-BIO-13
        schema_id: S-C3-03
        class: C3
        formal_predicate: s_c3_03
        constraint_text: >-
          Universal: for every genus x and subfamilies y, z, if x sits in y and in z
          then y = z. Instantiated on Panthera, which has exactly one parent taxon.
        logical_form: "forall x,y,z: in(x,y) AND in(x,z) -> y = z"
        gold_proposition: "Panthera sits in exactly one parent taxon, namely Pantherinae."
        answer_type: boolean
