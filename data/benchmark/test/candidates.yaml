  # P580/P582 difference on the P39 statement. The registered query
  # `office_holders_ranked_by_duration` v1 carries the ordering in its own text
  # and is cached under ADR-0011; the bearer's own dates are additionally
  # checked by claim_interval / claim_interval_end (ADR-0021 condition 4).
  - family_id: F-HIS-15
    domain: history
    theme: "the longest reign in a named monarchy"
    constraints:

      - constraint_id: K-C1-HIS-15
        schema_id: S-C1-05
        class: C1
        formal_predicate: s_c1_05
        constraint_text: >-
          A superlative over a closed comparison set has exactly one bearer; the
          longest-reigning holder of the office Monarch of the United Kingdom is
          Elizabeth II.
        logical_form: "argmax(reign_duration, holders_of(Monarch_of_the_UK)) = Elizabeth II"
        gold_proposition: "Elizabeth II is the longest-reigning monarch of the United Kingdom."
        answer_type: boolean
        answer_space: ["YES", "NO"]
        gold_answer: "YES"
        entities:
          - {label: "Elizabeth II", qid: Q9682}
          - {label: "George VI", qid: Q280856}
          - {label: "Monarch of the United Kingdom", qid: Q9134365}
        comparison_universe:
          universe: >-
            the recorded holders of the office Monarch of the United Kingdom
            (Q9134365), ranked by the duration of their reign
          membership_rule: >-
            Computed: every person carrying a Wikidata P39 statement whose value
            is Q9134365 and which bears a P580 start qualifier, as returned by
            the registered query `office_holders_ranked_by_duration` version 1.
            The query text, not this prose, defines the set; it returned 5 rows
            on 2026-10-08.
          measure: >-
            reign duration in days, computed inside the registered query as the
            difference between the P580 and P582 qualifiers on the P39
            statement. An open-ended reign is closed against the frozen literal
            date 2026-10-08T00:00:00Z written into the query text, never NOW(),
            so the ordering is reproducible (ADR-0021 condition 2).
          direction: max
          argmax_qid: Q9682
          argmax_label: "Elizabeth II"
          frozen_at: "2026-10-08"
          ranked_source:
            name: "Wikidata SPARQL — registered query office_holders_ranked_by_duration v1"
            url: "https://query.wikidata.org/sparql"
            retrieved: "2026-10-08"
            snapshot: "df08d13ceaac5c706d7939d4437a0951461035e9986b8fadd4dce73df3a12928"
            query: |
              SELECT ?item ?itemLabel ?start ?end ?days WHERE {
                ?item p:P39 ?statement .
                ?statement ps:P39 wd:Q9134365 ;
                           pq:P580 ?start .
                OPTIONAL { ?statement pq:P582 ?end . }
                BIND(COALESCE(?end, "2026-10-08T00:00:00Z"^^xsd:dateTime) AS ?endpoint)
                BIND((?endpoint - ?start) AS ?days)
                SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
              }
              ORDER BY DESC(?days)
            rank_of_argmax: 1
          note: >-
            Ordering as returned: Elizabeth II 25782 d, George VI 5535 d,
            George V 3205 d, Charles III 1491 d (open-ended, closed at the frozen
            date), Edward VIII 326 d.
        evidence_checks:
          - {kind: claim, subject_qid: Q9682, property: P39, expect_qid: Q9134365,
             description: "Elizabeth II (Q9682) position held (P39) -> Monarch of the United Kingdom (Q9134365)"}
          - {kind: claim_interval, subject_qid: Q9682, property: P39, value_qid: Q9134365,
             expect_year_at_most: 1952,
             description: "ADR-0021 cond. 4 — P580 on the bearer's own P39 statement is 1952"}
          - {kind: claim_interval_end, subject_qid: Q9682, property: P39, value_qid: Q9134365,
             expect_year: 2022,
             description: "ADR-0021 cond. 4 — P582 on the bearer's own P39 statement is 2022"}
          - {kind: claim_interval_end, subject_qid: Q280856, property: P39, value_qid: Q9134365,
             expect_year: 1952,
