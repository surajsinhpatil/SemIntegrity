[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semintegrity"
version = "0.1.0"
description = "Measuring Semantic Self-Inconsistency in LLMs Across Structured Integrity Constraints"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Surajsinh Patil" }]
keywords = ["llm-evaluation", "consistency", "integrity-constraints", "nlp"]

# Runtime deps are pinned in requirements/*.txt (split by execution context:
# login node vs GPU node). pyproject lists only the loose floor so that
# `pip install -e .` works for the pure-Python parts on any node.
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "orjson>=3.9",
  "pandas>=2.1",
  "numpy>=1.26,<2.1",
  "pyarrow>=15.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "tenacity>=8.2",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
inference = ["torch", "transformers", "vllm", "accelerate", "huggingface_hub"]
# `analysis` is needed from Phase 1 onward: the design validator's
# entity-familiarity check (§4.3) needs scipy, and without it that check now
# fails closed rather than passing silently.
analysis  = ["scipy", "statsmodels", "matplotlib", "krippendorff", "scikit-learn"]
# The Bayesian stack is heavy and not needed until Phase 8 (ADR-0004).
bayes     = ["pymc", "numpyro", "arviz"]
# `dev` includes `analysis` deliberately: the test suite exercises the validator,
# so a dev environment without scipy cannot actually test what it claims to.
dev       = ["semintegrity[analysis]", "pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pre-commit", "types-PyYAML"]

[project.scripts]
semint = "semintegrity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semintegrity = ["py.typed", "**/*.yaml", "**/*.json"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, no I/O, no network",
  "integration: touches filesystem or local pipeline wiring",
  "network: requires internet (Wikidata / HF / literature APIs)",
  "gpu: requires a GPU; must never run on the cluster login node",
  "slow: > 5 seconds",
]
filterwarnings = ["error::DeprecationWarning:semintegrity.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
  "E501",    # line length: enforced by the formatter, not the linter
  "N818",    # exception naming: `CacheMiss`, `DesignViolation` and
             # `SchemaAuditFailure` read better than an `...Error` suffix and are
             # already unambiguous; the proposal's own vocabulary is preferred.
  "RUF002",  # en-dashes in prose docstrings are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802", "C408"]
# Predicates must accept `kb` whether or not they use it: it is the D0 interface.
"src/semintegrity/detectors/d0/predicates/*.py" = ["ARG002"]
# `_no_order` must match the comparison-operator signature it replaces.
"src/semintegrity/schemas/enums.py" = ["ARG002"]
# The curly quotes here are the characters being normalised away, not typos.
"src/semintegrity/canonicalization/canonicaliser.py" = ["RUF001"]
# `common = dict(...)` is spread into keyword arguments; a literal cannot be.
"src/semintegrity/kb/evidence.py" = ["C408"]
# Typographic multiplication signs and en-dashes are intentional in generated prose.
"scripts/benchmark/make_examples_doc.py" = ["RUF001"]
# Backends must match the Backend protocol signature whether or not they use
# every argument; the stub deliberately ignores sampling parameters.
"src/semintegrity/inference/backend.py" = ["ARG002"]

[tool.mypy]
python_version = "3.10"
packages = ["semintegrity"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/semintegrity"]
branch = true
